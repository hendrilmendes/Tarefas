name: tarefas
description: "Um app para você salvar suas tarefas e anotações do dia a dia"
publish_to: 'none'

version: 4.0.0+20261015

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

  app_settings: ^9.0.0
  connectivity_plus: ^7.3.2
  cupertino_ui: ^1.1.3
  cupertino_icons: ^2.0.0
  device_info_plus: ^13.3.0
  disable_battery_optimization: ^1.1.2
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter_local_notifications: ^22.3.2
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: 1.7.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/img/
    - shorebird.yaml
